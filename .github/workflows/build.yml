name: Validate CPM Remote Avatar SDK

on:
  workflow_dispatch:
  push:
    branches: [feature/tpp-air-controller-0.4.0.0]

jobs:
  validate-sdk:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -A x64
      - name: Compilar
        run: cmake --build build --config Release --parallel
      - name: Testar controladores
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Bloquear pacote sem entidade
        shell: powershell
        run: |
          $entity = "wolvenkit\source\archive\cpm\entities\cpm_remote_player.ent"
          if (!(Test-Path $entity)) {
            Write-Host "SDK validado. Pacote jogavel bloqueado: falta cpm_remote_player.ent."
            exit 0
          }
          throw "Entidade encontrada, mas o empacotamento WolvenKit ainda precisa ser habilitado explicitamente."
