name: Build CPM 0.4.0.0 TPP Air Probe DEV

on:
  workflow_dispatch:
  push:
    branches: [feature/tpp-air-controller-0.4.0.0]

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -A x64
      - name: Compilar
        run: cmake --build build --config Release --parallel
      - name: Testar runtime
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Preparar probe DEV
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "package\red4ext\plugins\CPMClient" | Out-Null
          New-Item -ItemType Directory -Force -Path "package\r6\scripts\CPM" | Out-Null
          New-Item -ItemType Directory -Force -Path "package\r6\tweaks" | Out-Null
          New-Item -ItemType Directory -Force -Path "package\tools" | Out-Null
          Copy-Item "build\Release\CPMClient.dll" "package\red4ext\plugins\CPMClient\CPMClient.dll" -Force
          Copy-Item "build\Release\CPMServer.exe" "package\CPMServer.exe" -Force
          Copy-Item "resources\r6\scripts\CPM\CPMClient.reds" "package\r6\scripts\CPM\CPMClient.reds" -Force
          Copy-Item "resources\r6\tweaks\CPM.yaml" "package\r6\tweaks\CPM.yaml" -Force
          Copy-Item "tools\CPM-Physical-Air-Test-0.3.0.0.ps1" "package\tools\CPM-Physical-Air-Test-0.3.0.0.ps1" -Force
          Copy-Item "Start-Visual-Test.ps1","connection.example.json","install-client.bat","RUNTIME-AIR-0.4.0.0.md" "package" -Force
          @"
          CPM 0.4.0.0 TPP AIR PROBE DEV
          Requer RED4ext, redscript e TweakXL.
          Confirmar no log: PlayerPuppet true e NPCPuppet false.
          "@ | Set-Content "package\LEIA-ANTES.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: CPM-Windows-0.4.0.0-TPP-Air-Probe-DEV
          path: package
          if-no-files-found: error
          retention-days: 14
