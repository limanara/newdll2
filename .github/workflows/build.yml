
name: Build Cyberpunk Multiplayer RP - Fase 1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar CPM Client e Server
    runs-on: windows-2022

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v4

      - name: Configurar CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao configurar CMake"
          }

      - name: Compilar DLL e servidor
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) {
            throw "Falha na compilacao C++"
          }

      - name: Preparar pacote
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $client = Get-ChildItem build -Recurse -File |
            Where-Object { $_.Name -eq "CPMClient.dll" -and $_.FullName -match "Release" } |
            Select-Object -First 1

          $server = Get-ChildItem build -Recurse -File |
            Where-Object { $_.Name -eq "CPMServer.exe" -and $_.FullName -match "Release" } |
            Select-Object -First 1

          if (!$client) { throw "CPMClient.dll nao encontrada" }
          if (!$server) { throw "CPMServer.exe nao encontrado" }

          New-Item -ItemType Directory -Force -Path "package/red4ext/plugins/CPMClient" | Out-Null
          New-Item -ItemType Directory -Force -Path "package/r6/scripts/CPM" | Out-Null
          New-Item -ItemType Directory -Force -Path "package/rp_resources" | Out-Null

          Copy-Item $client.FullName "package/red4ext/plugins/CPMClient/CPMClient.dll"
          Copy-Item $server.FullName "package/CPMServer.exe"

          Copy-Item "resources/r6/scripts/CPM/*" "package/r6/scripts/CPM/" -Recurse -Force

          if (Test-Path "rp_resources") {
            Copy-Item "rp_resources/*" "package/rp_resources/" -Recurse -Force
          }

          $optionalFiles = @(
            "Start-Visual-Test.ps1",
            "connection.example.json",
            "install-client.bat",
            "README.md",
            "FASE1-RP.md",
            "CORRECAO-PULO.md",
            "TESTE-NPC-AUTOMATICO.md"
          )

          foreach ($file in $optionalFiles) {
            if (Test-Path $file) {
              Copy-Item $file "package/" -Force
            }
          }

          if (Test-Path "tools") {
            Copy-Item "tools" "package/tools" -Recurse -Force
          }

          Write-Host "Pacote preparado:"
          Get-ChildItem package -Recurse

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: CPM-RP-Fase1-Windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 30
