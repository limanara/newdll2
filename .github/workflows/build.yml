name: Build CPM 0.0.5.1 Force Transform

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar projeto
        run: cmake -S . -B build -A x64

      - name: Compilar cliente e servidor
        run: cmake --build build --config Release

      - name: Verificar binarios
        shell: powershell
        run: |
          if (!(Test-Path "build\Release\CPMClient.dll")) {
            throw "CPMClient.dll nao foi gerada."
          }

          if (!(Test-Path "build\Release\CPMServer.exe")) {
            throw "CPMServer.exe nao foi gerado."
          }

      - name: Preparar pacote
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package\red4ext\plugins\CPMClient | Out-Null
          New-Item -ItemType Directory -Force -Path package\r6\scripts\CPM | Out-Null
          New-Item -ItemType Directory -Force -Path package\tools | Out-Null

          Copy-Item build\Release\CPMClient.dll package\red4ext\plugins\CPMClient\
          Copy-Item build\Release\CPMServer.exe package\

          Copy-Item resources\r6\scripts\CPM\CPMClient.reds package\r6\scripts\CPM\

          Copy-Item tools\CPM-Test-Server-0.0.2.ps1 package\tools\
          Copy-Item tools\CPM-Player-Simulator-0.0.3.ps1 package\tools\
          Copy-Item tools\CPM-10-Players-Big-Test-0.0.4.ps1 package\tools\
          Copy-Item tools\CPM-Visual-Player-Test-0.0.5.1.ps1 package\tools\

          Copy-Item Start-Big-Test.ps1 package\
          Copy-Item Start-Visual-Test.ps1 package\
          Copy-Item connection.example.json package\
          Copy-Item install-client.bat package\
          Copy-Item README.md package\

      - name: Mostrar arquivos do pacote
        shell: powershell
        run: Get-ChildItem package -Recurse

      - name: Enviar CPM 0.0.5.1 Force Transform
        uses: actions/upload-artifact@v4
        with:
          name: CPM-Windows-0.0.5.1-Force-Transform
          path: package
          if-no-files-found: error
