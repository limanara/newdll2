name: Build CPM 0.0.7 Hybrid Interpolation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Compilar CPM 0.0.7
    runs-on: windows-2022

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Validar fontes 0.0.7
        shell: powershell
        run: |
          $required = @(
            "CMakeLists.txt",
            "src\Main.cpp",
            "src\Client.cpp",
            "src\Client.hpp",
            "src\Native.cpp",
            "src\Native.hpp",
            "src\Protocol.hpp",
            "server\Main.cpp",
            "resources\r6\scripts\CPM\CPMClient.reds",
            "tools\CPM-Hybrid-Interpolation-Test-0.0.7.ps1",
            "Start-Visual-Test.ps1",
            "Start-Big-Test.ps1",
            "connection.example.json",
            "install-client.bat",
            "README.md"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Arquivo fonte obrigatorio ausente: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Arquivo fonte vazio: $file"
            }
          }

          $cmake = Get-Content "CMakeLists.txt" -Raw

          if ($cmake -notmatch "VERSION 0\.0\.7") {
            throw "CMakeLists.txt nao corresponde a 0.0.7."
          }

          $client = Get-Content "src\Main.cpp" -Raw

          if ($client -notmatch "0\.0\.7 Hybrid Interpolation") {
            throw "src/Main.cpp nao corresponde a 0.0.7."
          }

          if ($client -notmatch "SEMVER\(0,0,7\)") {
            throw "Metadata da DLL nao corresponde a 0.0.7."
          }

          $server = Get-Content "server\Main.cpp" -Raw

          if ($server -notmatch "0\.0\.7 HYBRID INTERPOLATION") {
            throw "server/Main.cpp nao corresponde a 0.0.7."
          }

          $script = Get-Content `
            "resources\r6\scripts\CPM\CPMClient.reds" -Raw

          if ($script -match "ref<AIPositionSpec>") {
            throw "AIPositionSpec foi declarado incorretamente como ref."
          }

          if ($script -match 'movementType\s*=\s*n"(Sprint|Walk)"') {
            throw "movementType ainda usa CName invalido."
          }

          if (
            $script -notmatch "moveMovementType\.Sprint" -or
            $script -notmatch "moveMovementType\.Walk"
          ) {
            throw "Enums Walk/Sprint ausentes."
          }

          if ($script -notmatch "InterpolateTransform") {
            throw "Interpolacao visual direta ausente."
          }

          if ($script -notmatch `
            "this\.visualPosition\.X \+= dx \* 0\.18") {
            throw "Suavizacao de posicao ausente."
          }

          if ($script -notmatch "StartLocomotionAnimation") {
            throw "Comando auxiliar de locomocao ausente."
          }

          if ($script -match "activeMoveCommand|UpdateMoveTarget") {
            throw "Logica Continuous Path antiga encontrada."
          }

          if ($script -match "distanceSquared > 2\.25") {
            throw "Teleporte corretivo antigo ainda esta presente."
          }

          if ($script -notmatch "distanceSquared > 225\.0") {
            throw "Recuperacao extrema de 15 metros ausente."
          }

          if ($script -match "DisableCollider") {
            throw "Colisao ainda esta desabilitada."
          }

          if ($script -notmatch "locomotionCandidateTicks >= 10") {
            throw "Histerese de locomocao ausente."
          }

          $starter = Get-Content "Start-Visual-Test.ps1" -Raw

          if ($starter -notmatch `
            "CPM-Hybrid-Interpolation-Test-0\.0\.7\.ps1") {
            throw "Start-Visual-Test aponta para simulador errado."
          }

          Write-Host ""
          Write-Host "FONTES CPM 0.0.7 VALIDADAS" `
            -ForegroundColor Green
          Write-Host ""

      - name: Configurar projeto
        shell: powershell
        run: |
          cmake -S . -B build -A x64

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao configurar o projeto com CMake."
          }

      - name: Compilar cliente e servidor
        shell: powershell
        run: |
          cmake --build build --config Release

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao compilar o CPM 0.0.7."
          }

      - name: Verificar binarios
        shell: powershell
        run: |
          $binaries = @(
            "build\Release\CPMClient.dll",
            "build\Release\CPMServer.exe"
          )

          foreach ($file in $binaries) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Binario obrigatorio nao foi gerado: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Binario vazio ou invalido: $file"
            }
          }

          Get-Item $binaries |
            Select-Object FullName, Length, LastWriteTime

      - name: Preparar pacote limpo
        shell: powershell
        run: |
          if (Test-Path "package") {
            Remove-Item "package" -Recurse -Force
          }

          New-Item -ItemType Directory -Force `
            -Path "package\red4ext\plugins\CPMClient" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "package\r6\scripts\CPM" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "package\tools" | Out-Null

          Copy-Item `
            "build\Release\CPMClient.dll" `
            "package\red4ext\plugins\CPMClient\CPMClient.dll" `
            -Force

          Copy-Item `
            "build\Release\CPMServer.exe" `
            "package\CPMServer.exe" `
            -Force

          Copy-Item `
            "resources\r6\scripts\CPM\CPMClient.reds" `
            "package\r6\scripts\CPM\CPMClient.reds" `
            -Force

          Copy-Item `
            "tools\CPM-Hybrid-Interpolation-Test-0.0.7.ps1" `
            "package\tools\CPM-Hybrid-Interpolation-Test-0.0.7.ps1" `
            -Force

          Copy-Item `
            "tools\CPM-Test-Server-0.0.2.ps1" `
            "package\tools\CPM-Test-Server-0.0.2.ps1" `
            -Force

          Copy-Item `
            "tools\CPM-Player-Simulator-0.0.3.ps1" `
            "package\tools\CPM-Player-Simulator-0.0.3.ps1" `
            -Force

          Copy-Item `
            "tools\CPM-10-Players-Big-Test-0.0.4.ps1" `
            "package\tools\CPM-10-Players-Big-Test-0.0.4.ps1" `
            -Force

          Copy-Item `
            "Start-Visual-Test.ps1" `
            "package\Start-Visual-Test.ps1" `
            -Force

          Copy-Item `
            "Start-Big-Test.ps1" `
            "package\Start-Big-Test.ps1" `
            -Force

          Copy-Item `
            "connection.example.json" `
            "package\connection.example.json" `
            -Force

          Copy-Item `
            "install-client.bat" `
            "package\install-client.bat" `
            -Force

          Copy-Item `
            "README.md" `
            "package\README.md" `
            -Force

      - name: Validar pacote final
        shell: powershell
        run: |
          $requiredPackageFiles = @(
            "package\red4ext\plugins\CPMClient\CPMClient.dll",
            "package\r6\scripts\CPM\CPMClient.reds",
            "package\CPMServer.exe",
            "package\tools\CPM-Hybrid-Interpolation-Test-0.0.7.ps1",
            "package\tools\CPM-Test-Server-0.0.2.ps1",
            "package\tools\CPM-Player-Simulator-0.0.3.ps1",
            "package\tools\CPM-10-Players-Big-Test-0.0.4.ps1",
            "package\Start-Visual-Test.ps1",
            "package\Start-Big-Test.ps1",
            "package\connection.example.json",
            "package\install-client.bat",
            "package\README.md"
          )

          foreach ($file in $requiredPackageFiles) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Arquivo obrigatorio ausente no pacote: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Arquivo vazio no pacote: $file"
            }
          }

          $oldVisualTests = Get-ChildItem `
            "package\tools" -File |
            Where-Object {
              $_.Name -match `
                "CPM-(Visual-Player-Test-0\.0\.5|Smooth-Sync-Test-0\.0\.6\.[012]|Persistent-Movement-Test-0\.0\.6\.3|Continuous-Path-Test-0\.0\.6\.4)"
            }

          if ($oldVisualTests) {
            throw "Teste visual antigo encontrado: $($oldVisualTests.Name -join ', ')"
          }

          $script = Get-Content `
            "package\r6\scripts\CPM\CPMClient.reds" -Raw

          if ($script -match "ref<AIPositionSpec>") {
            throw "Pacote contem AIPositionSpec declarado como ref."
          }

          if ($script -match `
            'movementType\s*=\s*n"(Sprint|Walk)"') {
            throw "Pacote contem movementType usando CName."
          }

          if ($script -match "distanceSquared > 2\.25") {
            throw "Pacote contem teleporte corretivo antigo."
          }

          if ($script -match "DisableCollider") {
            throw "Pacote contem colisao desabilitada."
          }

          if ($script -notmatch "InterpolateTransform") {
            throw "Pacote nao contem interpolacao visual direta."
          }

          if ($script -notmatch `
            "GameInstance\.GetTeleportationFacility") {
            throw "Pacote nao aplica a transformacao interpolada."
          }

          if ($script -notmatch "StartLocomotionAnimation") {
            throw "Pacote nao contem controle auxiliar de locomocao."
          }

          if ($script -match "activeMoveCommand|UpdateMoveTarget") {
            throw "Pacote contem logica antiga da versao 0.0.6.4."
          }

          $starter = Get-Content `
            "package\Start-Visual-Test.ps1" -Raw

          if ($starter -notmatch `
            "CPM-Hybrid-Interpolation-Test-0\.0\.7\.ps1") {
            throw "Start-Visual-Test do pacote aponta para versao errada."
          }

          Write-Host ""
          Write-Host "PACOTE CPM 0.0.7 VALIDADO COM SUCESSO" `
            -ForegroundColor Green
          Write-Host ""

          Get-ChildItem "package" -Recurse |
            Select-Object FullName, Length, LastWriteTime

      - name: Enviar CPM 0.0.7 Hybrid Interpolation
        uses: actions/upload-artifact@v4
        with:
          name: CPM-Windows-0.0.7-Hybrid-Interpolation
          path: package
          if-no-files-found: error
          retention-days: 30
