name: Build CPM 0.0.8 Multi Remote

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar CPM 0.0.8
    runs-on: windows-2022

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Validar fontes 0.0.8
        shell: powershell
        run: |
          $required = @(
            "CMakeLists.txt",
            "src\Main.cpp",
            "src\Client.cpp",
            "src\Client.hpp",
            "src\Native.cpp",
            "src\Native.hpp",
            "src\Protocol.hpp",
            "server\Main.cpp",
            "resources\r6\scripts\CPM\CPMClient.reds",
            "tools\CPM-Multi-Remote-Test-0.0.8.ps1",
            "tools\CPM-Test-Server-0.0.2.ps1",
            "tools\CPM-Player-Simulator-0.0.3.ps1",
            "tools\CPM-10-Players-Big-Test-0.0.4.ps1",
            "Start-Visual-Test.ps1",
            "Start-Big-Test.ps1",
            "connection.example.json",
            "install-client.bat",
            "README.md"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Arquivo fonte obrigatorio ausente: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Arquivo fonte vazio: $file"
            }
          }

          $cmake = Get-Content "CMakeLists.txt" -Raw

          if ($cmake -notmatch "VERSION 0\.0\.8") {
            throw "CMakeLists.txt nao corresponde ao CPM 0.0.8."
          }

          $clientMain = Get-Content "src\Main.cpp" -Raw

          if ($clientMain -notmatch "0\.0\.8 Multi Remote") {
            throw "src/Main.cpp nao corresponde ao CPM Client 0.0.8."
          }

          if ($clientMain -notmatch "SEMVER\(0,0,8\)") {
            throw "A versao interna da CPMClient.dll nao corresponde a 0.0.8."
          }

          $clientNetwork = Get-Content "src\Client.cpp" -Raw

          if ($clientNetwork -notmatch "CPM 0\.0\.8 conectando") {
            throw "src/Client.cpp nao corresponde ao CPM 0.0.8."
          }

          $serverMain = Get-Content "server\Main.cpp" -Raw

          if ($serverMain -notmatch "0\.0\.8 MULTI REMOTE") {
            throw "server/Main.cpp nao corresponde ao CPM Server 0.0.8."
          }

          $script = Get-Content `
            "resources\r6\scripts\CPM\CPMClient.reds" -Raw

          if ($script -match "ref<AIPositionSpec>") {
            throw "AIPositionSpec foi declarado incorretamente como ref."
          }

          if ($script -match 'movementType\s*=\s*n"(Sprint|Walk)"') {
            throw "movementType ainda utiliza CName invalido."
          }

          if ($script -notmatch "moveMovementType\.Sprint") {
            throw "Enum de corrida Sprint nao encontrado."
          }

          if ($script -notmatch "moveMovementType\.Walk") {
            throw "Enum de caminhada Walk nao encontrado."
          }

          if ($script -notmatch "class CPMRemoteVisual") {
            throw "Controlador visual individual CPMRemoteVisual ausente."
          }

          if ($script -notmatch 'array<ref<CPMRemoteVisual>>') {
            throw "Colecao de jogadores remotos ausente."
          }

          if ($script -notmatch "SynchronizeRemotes") {
            throw "Sincronizacao de varios jogadores ausente."
          }

          if ($script -notmatch "ContainsRemote") {
            throw "Controle de duplicacao de jogadores ausente."
          }

          if ($script -notmatch "ArrayErase") {
            throw "Remocao individual de jogadores ausente."
          }

          if ($script -notmatch "InterpolateTransform") {
            throw "Interpolacao visual direta ausente."
          }

          if (
            $script -notmatch
            "this\.visualPosition\.X \+= dx \* 0\.18"
          ) {
            throw "Suavizacao estavel da versao 0.0.7 foi removida."
          }

          if (
            $script -notmatch
            "this\.visualPosition\.Y \+= dy \* 0\.18"
          ) {
            throw "Suavizacao do eixo Y ausente."
          }

          if (
            $script -notmatch
            "this\.visualPosition\.Z \+= dz \* 0\.18"
          ) {
            throw "Suavizacao do eixo Z ausente."
          }

          if ($script -notmatch "this\.visualYaw \+= yawDelta \* 0\.18") {
            throw "Interpolacao da rotacao ausente."
          }

          if ($script -notmatch "distanceSquared > 225\.0") {
            throw "Recuperacao extrema de 15 metros ausente."
          }

          if ($script -match "distanceSquared > 2\.25") {
            throw "Teleporte corretivo antigo ainda esta presente."
          }

          if ($script -notmatch "locomotionCandidateTicks >= 10") {
            throw "Histerese da locomocao ausente."
          }

          if ($script -notmatch "StartLocomotionAnimation") {
            throw "Controle auxiliar de animacao ausente."
          }

          if ($script -match "activeMoveCommand|UpdateMoveTarget") {
            throw "Logica antiga Continuous Path encontrada."
          }

          if ($script -match "DisableCollider") {
            throw "Desativacao antiga de colisao encontrada."
          }

          $starter = Get-Content "Start-Visual-Test.ps1" -Raw

          if (
            $starter -notmatch
            "CPM-Multi-Remote-Test-0\.0\.8\.ps1"
          ) {
            throw "Start-Visual-Test.ps1 aponta para o teste errado."
          }

          Write-Host ""
          Write-Host "Fontes CPM 0.0.8 validadas." `
            -ForegroundColor Green
          Write-Host ""

      - name: Configurar projeto
        shell: powershell
        run: |
          cmake -S . -B build -A x64

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao configurar o projeto com CMake."
          }

      - name: Compilar cliente e servidor
        shell: powershell
        run: |
          cmake --build build --config Release

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao compilar o CPM 0.0.8."
          }

      - name: Verificar binarios
        shell: powershell
        run: |
          $binaries = @(
            "build\Release\CPMClient.dll",
            "build\Release\CPMServer.exe"
          )

          foreach ($file in $binaries) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Binario obrigatorio nao foi gerado: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Binario vazio ou invalido: $file"
            }
          }

          Get-Item $binaries |
            Select-Object FullName, Length, LastWriteTime

      - name: Preparar pacote limpo
        shell: powershell
        run: |
          if (Test-Path "package") {
            Remove-Item "package" -Recurse -Force
          }

          New-Item -ItemType Directory -Force `
            -Path "package\red4ext\plugins\CPMClient" |
            Out-Null

          New-Item -ItemType Directory -Force `
            -Path "package\r6\scripts\CPM" |
            Out-Null

          New-Item -ItemType Directory -Force `
            -Path "package\tools" |
            Out-Null

          Copy-Item `
            "build\Release\CPMClient.dll" `
            "package\red4ext\plugins\CPMClient\CPMClient.dll" `
            -Force

          Copy-Item `
            "build\Release\CPMServer.exe" `
            "package\CPMServer.exe" `
            -Force

          Copy-Item `
            "resources\r6\scripts\CPM\CPMClient.reds" `
            "package\r6\scripts\CPM\CPMClient.reds" `
            -Force

          Copy-Item `
            "tools\CPM-Multi-Remote-Test-0.0.8.ps1" `
            "package\tools\CPM-Multi-Remote-Test-0.0.8.ps1" `
            -Force

          Copy-Item `
            "tools\CPM-Test-Server-0.0.2.ps1" `
            "package\tools\CPM-Test-Server-0.0.2.ps1" `
            -Force

          Copy-Item `
            "tools\CPM-Player-Simulator-0.0.3.ps1" `
            "package\tools\CPM-Player-Simulator-0.0.3.ps1" `
            -Force

          Copy-Item `
            "tools\CPM-10-Players-Big-Test-0.0.4.ps1" `
            "package\tools\CPM-10-Players-Big-Test-0.0.4.ps1" `
            -Force

          Copy-Item `
            "Start-Visual-Test.ps1" `
            "package\Start-Visual-Test.ps1" `
            -Force

          Copy-Item `
            "Start-Big-Test.ps1" `
            "package\Start-Big-Test.ps1" `
            -Force

          Copy-Item `
            "connection.example.json" `
            "package\connection.example.json" `
            -Force

          Copy-Item `
            "install-client.bat" `
            "package\install-client.bat" `
            -Force

          Copy-Item `
            "README.md" `
            "package\README.md" `
            -Force

      - name: Validar pacote final
        shell: powershell
        run: |
          $requiredPackageFiles = @(
            "package\red4ext\plugins\CPMClient\CPMClient.dll",
            "package\r6\scripts\CPM\CPMClient.reds",
            "package\CPMServer.exe",
            "package\tools\CPM-Multi-Remote-Test-0.0.8.ps1",
            "package\tools\CPM-Test-Server-0.0.2.ps1",
            "package\tools\CPM-Player-Simulator-0.0.3.ps1",
            "package\tools\CPM-10-Players-Big-Test-0.0.4.ps1",
            "package\Start-Visual-Test.ps1",
            "package\Start-Big-Test.ps1",
            "package\connection.example.json",
            "package\install-client.bat",
            "package\README.md"
          )

          foreach ($file in $requiredPackageFiles) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Arquivo obrigatorio ausente no pacote: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Arquivo vazio no pacote: $file"
            }
          }

          $forbiddenFiles = @(
            "package\tools\CPM-Hybrid-Interpolation-Test-0.0.7.ps1",
            "package\tools\CPM-Visual-Player-Test-0.0.5.ps1",
            "package\tools\CPM-Visual-Player-Test-0.0.5.1.ps1",
            "package\tools\CPM-Visual-Player-Test-0.0.5.2.ps1",
            "package\tools\CPM-Smooth-Sync-Test-0.0.6.ps1",
            "package\tools\CPM-Smooth-Sync-Test-0.0.6.1.ps1",
            "package\tools\CPM-Smooth-Sync-Test-0.0.6.2.ps1"
          )

          foreach ($file in $forbiddenFiles) {
            if (Test-Path $file) {
              throw "Arquivo antigo encontrado no pacote: $file"
            }
          }

          $packagedScript = Get-Content `
            "package\r6\scripts\CPM\CPMClient.reds" -Raw

          if (
            $packagedScript -notmatch "class CPMRemoteVisual" -or
            $packagedScript -notmatch "SynchronizeRemotes" -or
            $packagedScript -notmatch
              'array<ref<CPMRemoteVisual>>'
          ) {
            throw "Pacote nao contem o suporte Multi Remote."
          }

          if (
            $packagedScript -notmatch "InterpolateTransform" -or
            $packagedScript -notmatch
              "GameInstance\.GetTeleportationFacility"
          ) {
            throw "Interpolacao visual nao encontrada no pacote."
          }

          if (
            $packagedScript -match "distanceSquared > 2\.25" -or
            $packagedScript -match "DisableCollider" -or
            $packagedScript -match
              'movementType\s*=\s*n"(Sprint|Walk)"'
          ) {
            throw "Pacote contem codigo antigo ou incompatível."
          }

          if (
            $packagedScript -match
              "activeMoveCommand|UpdateMoveTarget"
          ) {
            throw "Pacote contem o controlador antigo."
          }

          $packagedStarter = Get-Content `
            "package\Start-Visual-Test.ps1" -Raw

          if (
            $packagedStarter -notmatch
              "CPM-Multi-Remote-Test-0\.0\.8\.ps1"
          ) {
            throw "Start-Visual-Test do pacote aponta para teste errado."
          }

          Write-Host ""
          Write-Host "PACOTE CPM 0.0.8 VALIDADO COM SUCESSO" `
            -ForegroundColor Green
          Write-Host ""

          Get-ChildItem "package" -Recurse |
            Select-Object FullName, Length, LastWriteTime

      - name: Enviar CPM 0.0.8 Multi Remote
        uses: actions/upload-artifact@v4
        with:
          name: CPM-Windows-0.0.8-Multi-Remote
          path: package
          if-no-files-found: error
          retention-days: 30
