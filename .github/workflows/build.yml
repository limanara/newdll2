name: Validate CPM 0.4.0.0 TPP Air Foundation

on:
  workflow_dispatch:
  push:
    branches: [feature/tpp-air-controller-0.4.0.0]

jobs:
  validate-foundation:
    runs-on: windows-2022

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar projeto
        run: cmake -S . -B build -A x64

      - name: Compilar fundacao
        run: cmake --build build --config Release --parallel

      - name: Testar controlador aereo
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Preparar relatorio de desenvolvimento
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "foundation-report\src" | Out-Null
          New-Item -ItemType Directory -Force -Path "foundation-report\r6\tweaks" | Out-Null

          Copy-Item "src\AirController.hpp" "foundation-report\src\AirController.hpp" -Force
          Copy-Item "src\AirController.cpp" "foundation-report\src\AirController.cpp" -Force
          Copy-Item "tests\AirControllerTests.cpp" "foundation-report\AirControllerTests.cpp" -Force
          Copy-Item "resources\r6\tweaks\CPM.yaml" "foundation-report\r6\tweaks\CPM.yaml" -Force
          Copy-Item "DEPENDENCIES-0.4.0.0.md" "foundation-report\DEPENDENCIES-0.4.0.0.md" -Force
          Copy-Item "ARCHITECTURE-0.4.0.0.md" "foundation-report\ARCHITECTURE-0.4.0.0.md" -Force

          @"
          CPM 0.4.0.0 FOUNDATION ONLY
          NAO INSTALAR NO JOGO.
          NAO CONTEM UMA NOVA DLL JOGAVEL.
          "@ | Set-Content "foundation-report\NAO-INSTALAR.txt"

          Get-ChildItem "foundation-report" -Recurse

      - name: Enviar relatorio da fundacao
        uses: actions/upload-artifact@v4
        with:
          name: CPM-0.4.0.0-FOUNDATION-NOT-FOR-GAME
          path: foundation-report
          if-no-files-found: error
          retention-days: 14
