name: Build CPM 0.0.6.3 Persistent Movement

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Compilar CPM 0.0.6.3
    runs-on: windows-2022

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Validar fontes 0.0.6.3
        shell: powershell
        run: |
          $required = @(
            "CMakeLists.txt",
            "src\Main.cpp",
            "src\Client.cpp",
            "src\Client.hpp",
            "src\Native.cpp",
            "src\Native.hpp",
            "src\Protocol.hpp",
            "server\Main.cpp",
            "resources\r6\scripts\CPM\CPMClient.reds",
            "tools\CPM-Persistent-Movement-Test-0.0.6.3.ps1",
            "Start-Visual-Test.ps1",
            "Start-Big-Test.ps1",
            "connection.example.json",
            "install-client.bat",
            "README.md"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Arquivo fonte obrigatorio ausente: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Arquivo fonte vazio: $file"
            }
          }

          $cmake = Get-Content "CMakeLists.txt" -Raw

          if ($cmake -notmatch "VERSION 0\.0\.6\.3") {
            throw "CMakeLists.txt nao corresponde a versao 0.0.6.3."
          }

          $client = Get-Content "src\Main.cpp" -Raw

          if ($client -notmatch "0\.0\.6\.3 Persistent Movement") {
            throw "src/Main.cpp nao corresponde ao cliente 0.0.6.3."
          }

          $server = Get-Content "server\Main.cpp" -Raw

          if ($server -notmatch "0\.0\.6\.3 PERSISTENT MOVEMENT") {
            throw "server/Main.cpp nao corresponde ao servidor 0.0.6.3."
          }

          $script = Get-Content `
            "resources\r6\scripts\CPM\CPMClient.reds" -Raw

          if ($script -match "ref<AIPositionSpec>") {
            throw "AIPositionSpec foi declarado incorretamente como ref."
          }

          if ($script -notmatch "let positionSpec: AIPositionSpec;") {
            throw "Declaracao correta de AIPositionSpec nao encontrada."
          }

          if ($script -notmatch "AIPositionSpec\.SetWorldPosition") {
            throw "Inicializacao correta de AIPositionSpec nao encontrada."
          }

          if ($script -match 'movementType\s*=\s*n"(Sprint|Walk)"') {
            throw "movementType ainda utiliza CName invalido."
          }

          if ($script -notmatch "moveMovementType\.Sprint") {
            throw "Enum moveMovementType.Sprint nao encontrado."
          }

          if ($script -notmatch "moveMovementType\.Walk") {
            throw "Enum moveMovementType.Walk nao encontrado."
          }

          if ($script -notmatch "commandTick >= 20") {
            throw "Intervalo persistente dos comandos nao foi encontrado."
          }

          if ($script -match "distanceSquared > 2\.25") {
            throw "Teleporte corretivo antigo ainda esta presente."
          }

          if ($script -notmatch "distanceSquared > 100\.0") {
            throw "Limite de teleporte emergencial de 10 metros ausente."
          }

          if ($script -match "DisableCollider") {
            throw "A colisao ainda esta desabilitada no NPC remoto."
          }

          if ($script -notmatch "locomotionCandidateTicks >= 10") {
            throw "Histerese da locomocao nao foi encontrada."
          }

          $starter = Get-Content "Start-Visual-Test.ps1" -Raw

          if ($starter -notmatch `
            "CPM-Persistent-Movement-Test-0\.0\.6\.3\.ps1") {
            throw "Start-Visual-Test.ps1 aponta para o simulador errado."
          }

          Write-Host ""
          Write-Host "FONTES CPM 0.0.6.3 VALIDADAS" `
            -ForegroundColor Green
          Write-Host ""

      - name: Configurar projeto
        shell: powershell
        run: |
          cmake -S . -B build -A x64

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao configurar o projeto com CMake."
          }

      - name: Compilar cliente e servidor
        shell: powershell
        run: |
          cmake --build build --config Release

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao compilar o CPM 0.0.6.3."
          }

      - name: Verificar binarios
        shell: powershell
        run: |
          $binaries = @(
            "build\Release\CPMClient.dll",
            "build\Release\CPMServer.exe"
          )

          foreach ($file in $binaries) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Binario obrigatorio nao foi gerado: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Binario vazio ou invalido: $file"
            }
          }

          Get-Item $binaries |
            Select-Object FullName, Length, LastWriteTime

      - name: Preparar pacote limpo
        shell: powershell
        run: |
          if (Test-Path "package") {
            Remove-Item "package" -Recurse -Force
          }

          New-Item -ItemType Directory -Force `
            -Path "package\red4ext\plugins\CPMClient" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "package\r6\scripts\CPM" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "package\tools" | Out-Null

          Copy-Item `
            "build\Release\CPMClient.dll" `
            "package\red4ext\plugins\CPMClient\CPMClient.dll" `
            -Force

          Copy-Item `
            "build\Release\CPMServer.exe" `
            "package\CPMServer.exe" `
            -Force

          Copy-Item `
            "resources\r6\scripts\CPM\CPMClient.reds" `
            "package\r6\scripts\CPM\CPMClient.reds" `
            -Force

          Copy-Item `
            "tools\CPM-Persistent-Movement-Test-0.0.6.3.ps1" `
            "package\tools\CPM-Persistent-Movement-Test-0.0.6.3.ps1" `
            -Force

          Copy-Item `
            "tools\CPM-Test-Server-0.0.2.ps1" `
            "package\tools\CPM-Test-Server-0.0.2.ps1" `
            -Force

          Copy-Item `
            "tools\CPM-Player-Simulator-0.0.3.ps1" `
            "package\tools\CPM-Player-Simulator-0.0.3.ps1" `
            -Force

          Copy-Item `
            "tools\CPM-10-Players-Big-Test-0.0.4.ps1" `
            "package\tools\CPM-10-Players-Big-Test-0.0.4.ps1" `
            -Force

          Copy-Item `
            "Start-Visual-Test.ps1" `
            "package\Start-Visual-Test.ps1" `
            -Force

          Copy-Item `
            "Start-Big-Test.ps1" `
            "package\Start-Big-Test.ps1" `
            -Force

          Copy-Item `
            "connection.example.json" `
            "package\connection.example.json" `
            -Force

          Copy-Item `
            "install-client.bat" `
            "package\install-client.bat" `
            -Force

          Copy-Item `
            "README.md" `
            "package\README.md" `
            -Force

      - name: Validar pacote final
        shell: powershell
        run: |
          $requiredPackageFiles = @(
            "package\red4ext\plugins\CPMClient\CPMClient.dll",
            "package\r6\scripts\CPM\CPMClient.reds",
            "package\CPMServer.exe",
            "package\tools\CPM-Persistent-Movement-Test-0.0.6.3.ps1",
            "package\tools\CPM-Test-Server-0.0.2.ps1",
            "package\tools\CPM-Player-Simulator-0.0.3.ps1",
            "package\tools\CPM-10-Players-Big-Test-0.0.4.ps1",
            "package\Start-Visual-Test.ps1",
            "package\Start-Big-Test.ps1",
            "package\connection.example.json",
            "package\install-client.bat",
            "package\README.md"
          )

          foreach ($file in $requiredPackageFiles) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Arquivo obrigatorio ausente no pacote: $file"
            }

            if ((Get-Item $file).Length -le 0) {
              throw "Arquivo vazio no pacote: $file"
            }
          }

          $oldTests = Get-ChildItem "package\tools" -File |
            Where-Object {
              $_.Name -match `
                "CPM-(Visual-Player-Test-0\.0\.5|Smooth-Sync-Test-0\.0\.6\.[012])"
            }

          if ($oldTests) {
            throw "Teste visual antigo encontrado: $($oldTests.Name -join ', ')"
          }

          $packagedScript = Get-Content `
            "package\r6\scripts\CPM\CPMClient.reds" -Raw

          if ($packagedScript -match "ref<AIPositionSpec>") {
            throw "Pacote contem AIPositionSpec declarado como ref."
          }

          if ($packagedScript -match `
            'movementType\s*=\s*n"(Sprint|Walk)"') {
            throw "Pacote contem movementType usando CName."
          }

          if ($packagedScript -match "distanceSquared > 2\.25") {
            throw "Pacote contem o teleporte corretivo antigo."
          }

          if ($packagedScript -match "DisableCollider") {
            throw "Pacote contem colisao desabilitada."
          }

          if ($packagedScript -notmatch "commandTick >= 20") {
            throw "Pacote nao contem comandos persistentes."
          }

          if ($packagedScript -notmatch `
            "locomotionCandidateTicks >= 10") {
            throw "Pacote nao contem histerese de locomocao."
          }

          $packagedStarter = Get-Content `
            "package\Start-Visual-Test.ps1" -Raw

          if ($packagedStarter -notmatch `
            "CPM-Persistent-Movement-Test-0\.0\.6\.3\.ps1") {
            throw "Start-Visual-Test.ps1 do pacote aponta para versao errada."
          }

          Write-Host ""
          Write-Host "PACOTE CPM 0.0.6.3 VALIDADO COM SUCESSO" `
            -ForegroundColor Green
          Write-Host ""

          Get-ChildItem "package" -Recurse |
            Select-Object FullName, Length, LastWriteTime

      - name: Enviar CPM 0.0.6.3 Persistent Movement
        uses: actions/upload-artifact@v4
        with:
          name: CPM-Windows-0.0.6.3-Persistent-Movement
          path: package
          if-no-files-found: error
          retention-days: 30
